modLoader = "javafml"
loaderVersion = "[47,)"
license = 'https://github.com/${repository}/blob/1.20.x/LICENSE.txt'
issueTrackerURL = "https://github.com/${repository}/issues"
itemIcon="nirvana:hemp"
configBackground="nirvana:textures/block/hemp_burlap.png"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''
Nirvana is a mod that aims to add Hemp and herb in a vanilla friendly way!
Get ready to make some Herb Rolled in Paper, Oddly Shaped Glasses, Herbal Salves, Burlap and much more.
'''

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "create"
    mandatory = false
    versionRange = "*"
    ordering = "NONE"
    side = "BOTH"
