modLoader = "javafml"
loaderVersion = "[1,)"
license = 'https://github.com/${repository}/blob/1.21.x/LICENSE.txt'
issueTrackerURL = "https://github.com/${repository}/issues"
itemIcon="nirvana:hemp"
configBackground="nirvana:textures/block/hemp_burlap.png"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''
Nirvana is a mod that aims to add Hemp and herb in a vanilla friendly way!
Get ready to make some Herb Rolled in Paper, Oddly Shaped Glasses, Herbal Salves, Burlap and much more.
'''
updateJSONURL = "https://api.modrinth.com/updates/nirvana-mod/forge_updates.json?neoforge=only"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    versionRange = "[21,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    versionRange = "[1.21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "create"
    versionRange = "[1.21.1-6.0.7,)"
    type = "optional"
    ordering = "NONE"
    side = "BOTH"

[[mixins]]
    config="${mod_id}.mixins.json"
[[mixins]]
    config="${mod_id}.forge.mixins.json"